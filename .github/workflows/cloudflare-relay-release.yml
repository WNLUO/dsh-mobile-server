# Publishes a stable Cloudflare Relay version after package validation and tests.
name: Release Cloudflare Relay

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version from cloudflare/package.json and .dsh-relay-upstream-version (x.y.z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - run: npm ci
        working-directory: cloudflare

      - run: npm test
        working-directory: cloudflare

      - run: npx wrangler deploy --dry-run
        working-directory: cloudflare

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { validateReleaseVersion } from './cloudflare/scripts/sync-release.mjs';

          const version = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(readFileSync('cloudflare/package.json', 'utf8')).version;
          const baselineVersion = readFileSync('cloudflare/.dsh-relay-upstream-version', 'utf8').trim();
          const releasedVersions = execFileSync('git', ['tag', '--list', 'cloudflare-v*'], { encoding: 'utf8' })
            .trim().split(/\s+/).filter(Boolean).map((tag) => tag.slice('cloudflare-v'.length));
          validateReleaseVersion({ version, packageVersion, baselineVersion, releasedVersions });
          NODE

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "cloudflare-v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Cloudflare Relay v$RELEASE_VERSION" --generate-notes
