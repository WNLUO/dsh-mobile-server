# 这份配置同时服务两种用法：
#   1. 点 README 里的一键部署按钮 —— 不用填任何命令，直接部署仓库里预编译好的产物；
#   2. 本地 `npx wrangler deploy` 自己部署 —— 想去改代码见下面「重新构建」。
name = "dsh-mobile-relay"
# **预编译产物已提交在 dist/**。Cloudflare 的一键部署要求「部署时不需要另填构建命令」，
# 所以这里不放 [build] 段：仓库里有的就是能直接跑的东西。
# 代价是产物要随源码一起更新，见「重新构建」那一节。
main = "dist/shim.mjs"
compatibility_date = "2026-10-15"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayInstance"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayInstance"]
